services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linker}
      POSTGRES_DB: ${POSTGRES_DB:-linker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
